name: Notebook validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install the learner environment and validation tools
        run: python -m pip install -r .binder/requirements.txt -r requirements-test.txt
      - name: Check maintainer code and notebook execution contracts
        run: |
          python -m ruff check
          python -m unittest discover -s tests
          python scripts/check_notebooks.py
          python scripts/check_local_setup.py
