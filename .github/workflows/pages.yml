name: Course website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notebooks:
    uses: ./.github/workflows/notebooks.yml
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install website tools
        run: |
          python3 -m venv /tmp/site-tools
          /tmp/site-tools/bin/pip install -r requirements-site.txt
      - name: Generate, build, and check links
        run: |
          /tmp/site-tools/bin/python scripts/build_site.py
          /tmp/site-tools/bin/mkdocs build --strict -f .site-build/mkdocs.yml
          /tmp/site-tools/bin/python scripts/check_site.py
          /tmp/site-tools/bin/python scripts/test_teaching_support.py
          /tmp/site-tools/bin/python scripts/test_oer_identity.py
          /tmp/site-tools/bin/python scripts/check_accessibility.py
      - name: Check browser navigation and accessibility
        run: |
          /tmp/site-tools/bin/pip install -r requirements-test.txt
          /tmp/site-tools/bin/playwright install --with-deps chromium
          /tmp/site-tools/bin/python scripts/test_site_browser.py
          /tmp/site-tools/bin/python scripts/test_accessibility_browser.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main'
        with:
          path: .site-build/output
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, notebooks]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
