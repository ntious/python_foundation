name: Course website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install website tools
        run: |
          python3 -m venv /tmp/site-tools
          /tmp/site-tools/bin/pip install -r requirements-site.txt
      - name: Generate, build, and check links
        run: |
          /tmp/site-tools/bin/python scripts/build_site.py
          /tmp/site-tools/bin/mkdocs build --strict -f .site-build/mkdocs.yml
          /tmp/site-tools/bin/python scripts/check_site.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main'
        with:
          path: .site-build/output
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
