name: Python explorer runtime
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  explorers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-site.txt -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build and exercise real browser Python
        run: |
          python scripts/build_site.py
          mkdocs build --strict -f .site-build/mkdocs.yml
          python scripts/test_visualizer.py
